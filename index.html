<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Novus77 的个人桌面：在 Windows XP 风格的网页里，探索我的项目、随笔和音乐。" />
  <meta name="theme-color" content="#245edb" />
  <title>Novus77 XP — 个人桌面</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="preload" as="image" href="assets/xp/login-logo.svg" />
  <link rel="stylesheet" href="css/xp-lib.css?v=20261028-music2" />
  <link rel="stylesheet" href="css/xp.css?v=20261028-music2" />
  <link rel="stylesheet" href="css/windows.css?v=20261028-music2" />
  <link rel="stylesheet" href="css/apps.css?v=20261028-music2" />
</head>
<body class="crt-enabled">
  <div id="boot-screen" aria-label="正在启动 Novus77 XP">
    <div class="boot-logo">
      <img src="assets/xp/login-logo.svg" alt="Windows XP" />
      <div class="boot-wordmark">Novus77</div>
      <div class="boot-edition">Personal Edition</div>
    </div>
    <div class="boot-progress-bar" role="progressbar" aria-label="正在启动"><div class="boot-progress-fill"></div></div>
    <button class="boot-skip" id="boot-skip">跳过启动动画 →</button>
    <div class="boot-copyright">A little nostalgia. A personal desktop.</div>
  </div>

  <div id="login-screen" style="display:none;">
    <div class="login-top-bar"></div>
    <main class="login-main">
      <div class="login-content">
        <div class="login-left">
          <div class="login-logo-container">
            <img class="xp-logo-image" src="assets/xp/login-logo.svg" alt="Windows XP" />
            <h1 class="brand-name">Novus77</h1>
            <p class="brand-subtitle">Developer / Creator</p>
          </div>
          <p class="login-instruction">请点击 Novus77 头像，登录我的个人桌面</p>
        </div>
        <div class="login-right">
          <button class="user-card" id="login-btn" aria-label="以 Novus77 身份登录">
            <img class="user-avatar" src="assets/images/avatar.jpg" alt="Novus77 的头像" />
            <span class="user-info"><span class="user-name">Novus77</span><span class="user-role">Developer / Creator</span></span>
            <span class="login-arrow" aria-hidden="true">➜</span>
          </button>
        </div>
      </div>
    </main>
    <footer class="login-bottom-bar">
      <button class="login-restart" onclick="restartDesktop()"><img src="assets/xp/restart.webp" alt="" />重启 Novus77 XP</button>
      <div class="login-footer-text"><p>登录之后，这里就交给你探索。</p><p>项目、随笔，还有一些喜欢的音乐。</p></div>
    </footer>
  </div>

  <div id="desktop" tabindex="-1" style="display:none;">
    <nav class="desktop-icons" aria-label="桌面应用">
      <button class="desktop-icon" data-app="about"><img src="assets/xp/about.webp" alt="" draggable="false" /><span>About Me</span></button>
      <button class="desktop-icon" data-app="resume"><img src="assets/xp/resume.webp" alt="" draggable="false" /><span>My Resume</span></button>
      <button class="desktop-icon" data-app="projects"><img src="assets/xp/projects.webp" alt="" draggable="false" /><span>My Projects</span></button>
      <button class="desktop-icon" data-app="contact"><img src="assets/xp/contact.webp" alt="" draggable="false" /><span>Contact Me</span></button>
      <button class="desktop-icon" data-app="music"><img src="assets/xp/music.webp" alt="" draggable="false" /><span>音乐播放器</span></button>
    </nav>
    <div id="windows-container"></div>

    <div id="taskbar" aria-label="任务栏">
      <button class="start-btn" id="start-btn" onclick="toggleStartMenu()" aria-label="开始菜单" aria-expanded="false" aria-controls="start-menu"><img src="assets/xp/start.webp" alt="start" /></button>
      <div id="taskbar-buttons" aria-label="已打开的应用"></div>
      <div class="taskbar-tray">
        <button class="tray-chevron" id="tray-toggle" aria-label="隐藏托盘图标" aria-expanded="true" aria-controls="tray-icons" title="隐藏托盘图标">‹</button>
        <div class="tray-icons" id="tray-icons">
        <button class="tray-button" id="welcome-btn" aria-label="桌面使用提示" aria-expanded="false" aria-controls="welcome-balloon" title="桌面使用提示"><img src="assets/xp/welcome.webp" alt="" /></button>
        <button class="tray-button" id="volume-btn" aria-label="静音" aria-pressed="false" title="静音"><img src="assets/xp/volume.webp" alt="" /></button>
        <button class="tray-button" onclick="openWindow('about');openWindow('projects')" aria-label="快速打开关于我和我的项目" title="快速开始"><img src="assets/xp/quickstart.webp" alt="" /></button>
        </div>
        <time class="tray-clock" id="tray-clock"></time>
      </div>
    </div>

    <section id="start-menu" aria-label="开始菜单" style="display:none;">
      <header class="sm-header"><img class="sm-avatar" src="assets/images/avatar.jpg" alt="" /><span class="sm-username">Novus77</span></header>
      <div class="sm-body">
        <div class="sm-left">
          <button class="sm-item sm-pinned" data-app="projects"><img src="assets/xp/projects.webp" alt="" /><span><strong>我的项目</strong><small>作品与实验</small></span></button>
          <button class="sm-item sm-pinned" data-app="contact"><img src="assets/xp/contact.webp" alt="" /><span><strong>联系方式</strong><small>给我写封邮件</small></span></button>
          <div class="sm-divider"></div>
          <button class="sm-item" data-app="about"><img src="assets/xp/about.webp" alt="" /><span>关于我</span></button>
          <button class="sm-item" data-app="resume"><img src="assets/xp/resume.webp" alt="" /><span>我的简历</span></button>
          <button class="sm-item" data-app="notes"><img src="assets/xp/notes.webp" alt="" /><span>我的文档</span></button>
          <button class="sm-item" data-app="music"><img src="assets/xp/music.webp" alt="" /><span>Windows Media Player</span></button>
        </div>
        <div class="sm-right">
          <button class="sm-right-item" data-app="notes"><img src="assets/icons/folder.png" alt="" />我的文档</button>
          <button class="sm-right-item" data-app="music"><img src="assets/xp/music.webp" alt="" />我的音乐</button>
          <button class="sm-right-item" data-app="projects"><img src="assets/xp/projects.webp" alt="" />我的项目</button>
          <div class="sm-right-divider"></div>
          <button class="sm-right-item" data-app="about"><img src="assets/icons/mycomputer.png" alt="" />我的电脑</button>
          <button class="sm-right-item" id="menu-crt" aria-pressed="true"><img src="assets/xp/welcome.webp" alt="" />CRT 屏幕效果</button>
        </div>
      </div>
      <footer class="sm-footer">
        <button class="sm-footer-btn" onclick="logOffDesktop()"><img src="assets/xp/logoff.webp" alt="" />注销</button>
        <button class="sm-footer-btn" onclick="handleShutdown()"><img src="assets/xp/shutdown.webp" alt="" />关闭计算机</button>
      </footer>
    </section>

    <aside class="welcome-balloon" id="welcome-balloon" hidden>
      <button class="balloon-close" aria-label="关闭欢迎提示">×</button>
      <strong><img src="assets/xp/welcome.webp" alt="" />欢迎来到 Novus77 XP</strong>
      <p>我的个人网站，也是一台可以探索的电脑。</p>
      <p class="desktop-hint">双击桌面图标，或从「开始」菜单打开应用。</p>
      <small>小提示：可以拖动窗口，也可以试试右下角的 CRT 开关。</small>
    </aside>
    <div class="desktop-context" id="desktop-context" hidden>
      <button onclick="WM.showDesktop();closeDesktopContext()">显示桌面</button>
      <button onclick="toggleCRT();closeDesktopContext()">切换 CRT 屏幕效果</button>
      <hr />
      <button onclick="openWindow('about');closeDesktopContext()">关于 Novus77 XP</button>
    </div>
  </div>

  <div id="shutdown-screen" style="display:none;">
    <div class="shutdown-content"><img src="assets/xp/login-logo.svg" alt="Windows XP" /><p class="shutdown-text">现在可以安心休息了。</p><button onclick="restartDesktop()">重新启动 Novus77 XP</button></div>
  </div>
  <noscript><div class="noscript-message">这个 XP 桌面需要 JavaScript。你也可以直接联系我：<a href="mailto:1432680433@qq.com">1432680433@qq.com</a>。</div></noscript>
  <script src="js/clock.js?v=20261028-music2"></script>
  <script src="js/boot.js?v=20261028-music2"></script>
  <script src="js/windows.js?v=20261028-music2"></script>
  <script src="js/apps.js?v=20261028-music2"></script>
  <script src="js/music.js?v=20261028-music2"></script>
  <script src="js/main.js?v=20261028-music2"></script>
</body>
</html>
